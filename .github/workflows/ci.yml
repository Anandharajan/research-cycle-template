name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install ruff mypy pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: |
          if [ -d src ] && [ -n "$(find src -name '*.py' -print -quit)" ]; then mypy src; else echo "No Python in src/ yet"; fi
      - name: Test
        run: |
          if [ -d tests ] && [ -n "$(find tests -name '*.py' -print -quit)" ]; then pytest --cov=src --cov-fail-under=70; else echo "No tests yet (template)"; fi
